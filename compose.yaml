
name: lab7-compose

services:
  db:
    image: postgres:18
    restart: unless-stopped
    environment:
      POSTGRES_DB: lab7
      POSTGRES_USER: labuser
      POSTGRES_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    volumes:
      - postgres_data:/var/lib/postgresql
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U labuser -d lab7"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

  api:
    build:
      context: .
      dockerfile: .devcontainer/Dockerfile
    image: lab7-fastapi:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:18000:8000"
    environment:
      DB_HOST: db
      DB_PORT: "5432"
      DB_NAME: lab7
      DB_USER: labuser
      DB_PASSWORD_FILE: /run/secrets/db_password
    secrets:
      - db_password
    depends_on:
      db:
        condition: service_healthy

volumes:
  postgres_data:

secrets:
  db_password:
    file: ./secrets/db_password.txt
