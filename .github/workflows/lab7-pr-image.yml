name: Lab 7 - PR Docker Image

on:
  pull_request:
    branches:
      - main
    types:
      - opened
      - synchronize
      - reopened

permissions:
  contents: read

jobs:
  docker-build:
    name: Build temporary Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Generate temporary tag
        id: image
        env:
          PR_NUMBER: ${{ github.event.pull_request.number }}
          COMMIT_SHA: ${{ github.event.pull_request.head.sha }}
        run: |
          SHORT_SHA="${COMMIT_SHA:0:7}"
          IMAGE_TAG="git-rest-lab2:pr-${PR_NUMBER}-${SHORT_SHA}"
          echo "tag=$IMAGE_TAG" >> "$GITHUB_OUTPUT"
          echo "Temporary image: $IMAGE_TAG"

      - name: Build Docker image
        run: |
          docker build \
            -f .devcontainer/Dockerfile \
            -t "${{ steps.image.outputs.tag }}" \
            .

      - name: Verify image
        run: |
          docker image inspect "${{ steps.image.outputs.tag }}"
          docker images git-rest-lab2