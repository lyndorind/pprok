
name: Docker Security Scan

on:
  workflow_dispatch:

  schedule:
    - cron: '0 6 * * 1'

permissions:
  contents: read
  security-events: write

jobs:
  security:
    name: Scan Docker image
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # TRIVY
      - name: Scan image with Trivy
        uses: aquasecurity/trivy-action@v0.36.0
        with:
          image-ref: lyndorind/pprok:0.2.2
          format: sarif
          output: trivy-results.sarif
          exit-code: '0'

      - name: Upload Trivy SARIF
        if: ${{ always() && hashFiles('trivy-results.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: trivy-results.sarif
          category: trivy

      # SNYK
      - name: Pull Docker image for Snyk
        if: always()
        run: docker pull lyndorind/pprok:0.2.2

      - name: Scan image with Snyk
        if: always()
        uses: snyk/actions/docker@master
        continue-on-error: true
        env:
          SNYK_TOKEN: ${{ secrets.SNYK_TOKEN }}
        with:
          image: lyndorind/pprok:0.2.2
          args: --file=.devcontainer/Dockerfile --sarif-file-output=snyk.sarif

      # FIX SNYK SARIF
      - name: Normalize Snyk SARIF severity
        if: ${{ always() && hashFiles('snyk.sarif') != '' }}
        shell: bash
        run: |
          python3 - <<'PY'
          import json
          import math

          path = "snyk.sarif"

          with open(path, encoding="utf-8") as f:
              report = json.load(f)

          fixed = 0

          def clean(obj):
              global fixed

              if isinstance(obj, dict):
                  if "security-severity" in obj:
                      value = obj["security-severity"]

                      try:
                          score = float(value)
                          valid = (
                              math.isfinite(score)
                              and 0.0 <= score <= 10.0
                          )
                      except (ValueError, TypeError, OverflowError):
                          valid = False

                      if valid:
                          obj["security-severity"] = str(score)
                      else:
                          del obj["security-severity"]
                          fixed += 1

                  for value in obj.values():
                      clean(value)

              elif isinstance(obj, list):
                  for item in obj:
                      clean(item)

          clean(report)
          with open("snyk-fixed.sarif", "w", encoding="utf-8") as f:
            json.dump(report, f, indent=2, ensure_ascii=False)

          print(f"Removed {fixed} invalid severity values")

          def verify(obj):
              if isinstance(obj, dict):
                  if "security-severity" in obj:
                      score = float(obj["security-severity"])
                      assert math.isfinite(score)
                      assert 0.0 <= score <= 10.0

                  for value in obj.values():
                      verify(value)

              elif isinstance(obj, list):
                  for item in obj:
                      verify(item)

          verify(report)
          print("SARIF severity validation passed")
          PY

 
      - name: Upload Snyk SARIF
        if: ${{ always() && hashFiles('snyk-fixed.sarif') != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: snyk-fixed.sarif
          category: snyk


      # GRYPE
      - name: Scan image with Grype
        if: always()
        id: grype
        uses: anchore/scan-action@v7
        with:
          image: lyndorind/pprok:0.2.2
          fail-build: false
          output-format: sarif

      - name: Upload Grype SARIF
        if: ${{ always() && steps.grype.outputs.sarif != '' }}
        uses: github/codeql-action/upload-sarif@v4
        with:
          sarif_file: ${{ steps.grype.outputs.sarif }}
          category: grype
