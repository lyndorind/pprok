
services:
  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.137.0
    command:
      - "--config=/etc/otelcol-contrib/config.yaml"
    volumes:
      - ./monitoring/otel-collector/config.yaml:/etc/otelcol-contrib/config.yaml:ro
    ports:
      - "127.0.0.1:4317:4317"
      - "127.0.0.1:4318:4318"
      - "127.0.0.1:9464:9464"
    restart: unless-stopped
