[project]
name = "git-rest-lab2"
description = "REST service project for Git and CI/CD laboratory work"
dynamic = ["version"]
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
keywords = ["fastapi", "rest", "git", "ci-cd"]
authors = [
    { name = "Polina Prokopenko", email = "prokopenko.polina_zk41@edu.kpi.ua" }
]
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.141.1",
    "httpx>=0.28.1",
    "opentelemetry-distro[otlp]>=0.65b0",
    "requests>=2.32.5",
    "uvicorn[standard]>=0.52.4",
]

[build-system]
requires = ["setuptools>=84.0.0"]
build-backend = "setuptools.build_meta"

[dependency-groups]
dev = [
    "allure-pytest>=2.16.0",
    "pytest>=9.1.1",
    "pytest-cov>=7.1.0",
    "ruff==0.17.3",
]

[tool.uv]
required-version = ">=0.12.6"
default-groups = ["dev"]

[tool.setuptools.dynamic]
version = {attr = "git_rest_lab2.__version__"}

[tool.setuptools.packages.find]
where = ["src"]
namespaces = false

[tool.pytest.ini_options]
minversion = "9.0"
addopts = ["--cov", "--cov-report=xml", "--alluredir=allure-results"]
testpaths = ["tests"]

[tool.coverage.run]
branch = true
source = ["src"]
relative_files = true
omit = [
    "**/__init__.py",
    "**/__main__.py"
]

[tool.coverage.paths]
source = ["src/"]

[tool.coverage.report]
show_missing = true

[tool.ruff]
src = ["src"]
fix = true
show-fixes = true
output-format = "full"
